<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lobby Display</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    /* Fill the screen like fullscreen, even if the browser blocks true fullscreen */
    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="player" src="videos/lobby.mp4" loop muted autoplay playsinline preload="auto"></video>

  <script>
    (function(){
      const player = document.getElementById('player');
      let wakeLock = null;

      async function ensureWakeLock(){
        try{
          if('wakeLock' in navigator){
            if(!wakeLock){
              wakeLock = await navigator.wakeLock.request('screen');
              wakeLock.addEventListener && wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
            }
          }
        }catch(_){}
      }

      async function goFullscreen(){
        try{
          if(!document.fullscreenElement){
            await player.requestFullscreen();
          }
        }catch(_){}
      }

      function keepPlaying(){
        if(player.paused) player.play().catch(()=>{});
      }

      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible'){
          ensureWakeLock();
          goFullscreen();
          keepPlaying();
        }
      });

      player.addEventListener('loadeddata', () => { goFullscreen(); keepPlaying(); });
      player.addEventListener('play', () => { ensureWakeLock(); goFullscreen(); });
      // Loop is handled by the attribute; this just double-sures it
      player.addEventListener('ended', () => { player.play().catch(()=>{}); });

      // Kick things off on load
      ensureWakeLock();
      goFullscreen();
      keepPlaying();

      // Periodic nudge for kiosk setups
      setInterval(keepPlaying, 10000);
    })();
  </script>
</body>
</html>
